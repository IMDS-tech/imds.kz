name: Public Website Container
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/imds-tech/imds.kz:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify current main image exists in GHCR
        if: github.event_name == 'pull_request'
        run: docker buildx imagetools inspect ghcr.io/imds-tech/imds.kz:${{ github.event.pull_request.base.sha }}
      - name: Verify published image exists in GHCR
        if: github.event_name == 'push'
        run: docker buildx imagetools inspect ghcr.io/imds-tech/imds.kz:${{ github.sha }}
